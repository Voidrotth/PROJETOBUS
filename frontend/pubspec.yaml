name: projetobus_frontend
description: Aplicativo PROJETOBUS (dashboard da SEMOB para TV)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  intl: ^0.19.0
  # Sessão do usuário
  shared_preferences: ^2.5.3
  # Tempo real do painel (Socket.IO do backend Node)
  socket_io_client: ^3.1.2
  # Download dos arquivos exportados no painel web (já vinha junto com o http)
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/imagens/logo_prefeitura.jpg

  # Poppins, a fonte do site da Prefeitura, empacotada para funcionar sem internet
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-300.ttf
          weight: 300
        - asset: assets/fonts/Poppins-400.ttf
          weight: 400
        - asset: assets/fonts/Poppins-500.ttf
          weight: 500
        - asset: assets/fonts/Poppins-600.ttf
          weight: 600
        - asset: assets/fonts/Poppins-700.ttf
          weight: 700
