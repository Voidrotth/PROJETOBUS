name: projetobus_frontend
description: Aplicativo PROJETOBUS (painel web e app do motorista)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  intl: ^0.19.0
  # Sessão, fila offline de GPS
  shared_preferences: ^2.5.3
  # GPS (com serviço em primeiro plano no Android para rodar com a tela desligada)
  geolocator: ^14.0.2
  # Tempo real do painel (Socket.IO do backend Node)
  socket_io_client: ^3.1.2
  # Mapa com OpenStreetMap (sem chave de API)
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  # Download dos arquivos exportados no painel web (já vinha junto com o http)
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Fontes do design system (Figma), empacotadas para funcionar sem internet
  fonts:
    - family: FjallaOne
      fonts:
        - asset: assets/fonts/FjallaOne-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-300.ttf
          weight: 300
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-400.ttf
          weight: 400
        - asset: assets/fonts/SpaceMono-700.ttf
          weight: 700
